name: 盘中刷新（只更新页面，不存档）

on:
  schedule:
    # UTC 时间，北京 = UTC+8
    # 行情：北京 9:30（开盘）10:30 11:30（上午收盘）
    - cron: '30 1,2,3 * * 1-5'
    # 行情：北京 13:00（下午开盘）14:00 15:00（收盘）16:00
    # 龙虎榜：北京 17:00 18:00 19:00 20:00（已公布就更新，未公布则沿用上一期）
    - cron: '0 5,6,7,8,9,10,11,12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出历史存档（仅用于对比，不写入）
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 抓取行情 + 尝试抓龙虎榜（写临时目录，不提交）
        run: |
          python3 fetch_data.py --stage market
          # 龙虎榜同时尝试：已公布则更新，未公布脚本会自行跳过、页面沿用上一期
          python3 fetch_data.py --stage lhb || true

      - name: 生成页面
        run: python3 build_html.py

      - name: 准备待发布页面
        run: |
          mkdir -p _public
          cp index.html _public/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'

      - name: 发布到线上（不提交，仓库零增长）
        id: deployment
        uses: actions/deploy-pages@v4
