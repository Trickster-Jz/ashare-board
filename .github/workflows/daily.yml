name: 每日正式存档（21点）

on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC + 8
    # 北京 21:00 = UTC 13:00，此刻 UTC 与北京同属一天，不会出现跨日错位
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: '抓取阶段（all=行情+龙虎榜）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - market
          - lhb

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 与盘中刷新共用一把锁：两个流程同时部署 Pages 会互相打断
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 决定抓取阶段
        id: st
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ github.event.inputs.stage }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_STAGE" ]; then
            echo "stage=$INPUT_STAGE" >> "$GITHUB_OUTPUT"
          else
            echo "stage=all" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓取数据
        env:
          STAGE: ${{ steps.st.outputs.stage }}
        run: |
          if [ "$STAGE" = "all" ]; then
            python3 fetch_data.py --stage market
            python3 fetch_data.py --stage lhb
          else
            python3 fetch_data.py --stage "$STAGE"
          fi

      - name: 记录存档时刻
        run: python3 fetch_data.py --stage archive

      - name: 生成页面
        run: python3 build_html.py

      - name: 提交存档（页面不入 git 历史，避免仓库膨胀）
        env:
          STAGE: ${{ steps.st.outputs.stage }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --cached index.html --ignore-unmatch -q
          git add -A
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 存档 $STAGE 数据"
            # 页面上写的日记会直接提交到 data/*.json，若此刻刚好错开就 rebase 后再推
            git push || { git pull --rebase --autostash origin main && git push; }
          fi

      - name: 准备待发布页面
        run: |
          mkdir -p _public
          cp index.html _public/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'

      # 刚上传的包，artifacts 服务要一两秒才建好索引；
      # 立刻发布会报「Fetching artifact metadata failed / Found 0 artifact(s)」。
      - name: 等页面包建好索引
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 15); do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 | python3 -c "import json,sys;d=json.load(sys.stdin);print(sum(1 for a in d.get('artifacts',[]) if a['name']=='github-pages'))" 2>/dev/null || echo 0)
            echo "第 $i 次检查：github-pages 包 = ${n:-0}"
            [ "${n:-0}" -ge 1 ] && break
            sleep 4
          done
          sleep 3

      # GitHub Pages 偶发抽风：报「Deployment failed, try again later」
      # 或「Fetching artifact metadata failed」。隔一会儿再发，多数能过。
      - name: 发布到线上
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 发布失败，等 20 秒
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: 重新发布
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 仍然失败，等 40 秒
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 40

      - name: 最后一次尝试
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
