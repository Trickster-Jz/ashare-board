name: 每日正式存档（23点）

on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC + 8
    # 北京 23:05 = UTC 15:05。避开整点（整点排队最堵，容易晚到甚至被丢），
    # 也刻意不放在 24:00：那一刻 UTC 还停在前一天，任何按本地时间取日期的代码都会错位一天。
    - cron: '5 15 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: '抓取阶段（all=行情+龙虎榜）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - market
          - lhb

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 决定抓取阶段
        id: st
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ github.event.inputs.stage }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_STAGE" ]; then
            echo "stage=$INPUT_STAGE" >> "$GITHUB_OUTPUT"
          else
            echo "stage=all" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓取数据
        env:
          STAGE: ${{ steps.st.outputs.stage }}
        run: |
          if [ "$STAGE" = "all" ]; then
            python3 fetch_data.py --stage market
            python3 fetch_data.py --stage lhb
          else
            python3 fetch_data.py --stage "$STAGE"
          fi

      - name: 生成页面
        run: python3 build_html.py

      - name: 提交存档（页面不入 git 历史，避免仓库膨胀）
        env:
          STAGE: ${{ steps.st.outputs.stage }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --cached index.html --ignore-unmatch -q
          git add -A
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 存档 $STAGE 数据"
            # 页面上写的日记会直接提交到 data/*.json，若此刻刚好错开就 rebase 后再推
            git push || { git pull --rebase --autostash origin main && git push; }
          fi

      - name: 准备待发布页面
        run: |
          mkdir -p _public
          cp index.html _public/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'

      - name: 发布到线上
        id: deployment
        uses: actions/deploy-pages@v4
